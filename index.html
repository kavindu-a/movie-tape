<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>MoviexTape • Cinematic Requests</title>
  <!-- Google Fonts + Font Awesome -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at 20% 30%, #0a0f1e, #03050b);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .glass-card {
      background: rgba(15, 25, 45, 0.75);
      backdrop-filter: blur(14px);
      border-radius: 2rem;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 25px 45px rgba(0, 0, 0, 0.5), 0 0 0 0.5px rgba(255, 255, 255, 0.1);
      transition: all 0.3s ease;
    }

    .container {
      max-width: 1300px;
      width: 100%;
      margin: 0 auto;
    }

    .auth-panel {
      max-width: 460px;
      margin: 0 auto;
      padding: 2rem 2rem 2.5rem;
    }

    .dashboard-panel {
      padding: 2rem;
    }

    h1, h2, h3 {
      font-weight: 600;
      letter-spacing: -0.3px;
    }

    .neon-text {
      background: linear-gradient(135deg, #FFD966, #FF8C42, #FF2E5E);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    .btn {
      border: none;
      background: linear-gradient(95deg, #3b2c6e, #201c3c);
      color: white;
      font-weight: 600;
      padding: 12px 24px;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.25s;
      box-shadow: 0 5px 12px rgba(0,0,0,0.3);
      font-size: 0.95rem;
    }

    .btn-primary {
      background: linear-gradient(95deg, #FF4D6D, #C9184A);
      box-shadow: 0 8px 20px rgba(201, 24, 74, 0.3);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      filter: brightness(1.05);
    }

    .btn-outline {
      background: transparent;
      border: 1px solid #FF8C42;
      color: #FF8C42;
      box-shadow: none;
    }

    input {
      background: rgba(20, 30, 55, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 40px;
      padding: 12px 20px;
      color: white;
      font-size: 0.9rem;
      width: 100%;
      outline: none;
      transition: 0.2s;
    }

    input:focus {
      border-color: #FF8C42;
      box-shadow: 0 0 0 2px rgba(255, 140, 66, 0.3);
    }

    .coin-chip {
      background: #00000066;
      backdrop-filter: blur(8px);
      border-radius: 80px;
      padding: 6px 16px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: bold;
      border: 1px solid #FFD966;
    }

    .spin-wheel-container {
      display: flex;
      justify-content: center;
      margin: 20px 0;
    }

    canvas {
      max-width: 260px;
      width: 100%;
      cursor: pointer;
      transition: filter 0.2s;
    }

    canvas:active {
      transform: scale(0.98);
    }

    .order-status {
      background: rgba(0,0,0,0.5);
      border-radius: 60px;
      padding: 18px 20px;
      animation: fadeSlide 0.5s ease;
    }

    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(15px);}
      to { opacity: 1; transform: translateY(0);}
    }

    .blink-warning {
      animation: softPulse 1.2s infinite;
    }

    @keyframes softPulse {
      0% { opacity: 0.7; background: rgba(255, 70, 70, 0.2);}
      100% { opacity: 1; background: rgba(255, 70, 70, 0.5);}
    }

    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: #1e1f2c;
      backdrop-filter: blur(16px);
      padding: 14px 28px;
      border-radius: 50px;
      color: white;
      font-weight: 500;
      z-index: 2000;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      border-left: 6px solid #ffb347;
      pointer-events: none;
      animation: fadeUp 0.3s ease;
    }

    @keyframes fadeUp {
      from { bottom: 0; opacity: 0; }
      to { bottom: 30px; opacity: 1; }
    }
  </style>
</head>
<body>
<div class="container" id="appRoot">
  <!-- AUTH SECTION -->
  <div id="authSection" class="glass-card auth-panel">
    <div style="text-align: center; margin-bottom: 24px;">
      <i class="fas fa-film" style="font-size: 48px; color: #FF8C42;"></i>
      <h1 class="neon-text" style="font-size: 2.2rem;">Moviex<span style="color:#FFD966">Tape</span></h1>
      <p style="color:#aaa;">Your cinematic gateway</p>
    </div>
    <div style="display: flex; gap: 12px; margin-bottom: 28px;">
      <button id="showLoginBtn" class="btn" style="flex:1;">Login</button>
      <button id="showRegisterBtn" class="btn btn-outline" style="flex:1;">Register</button>
    </div>
    <!-- Login Form -->
    <div id="loginForm">
      <input type="email" id="loginEmail" placeholder="Email" autocomplete="email">
      <input type="password" id="loginPassword" placeholder="Password" style="margin-top: 16px;">
      <button id="doLoginBtn" class="btn btn-primary" style="width:100%; margin-top: 24px;">Sign In <i class="fas fa-arrow-right"></i></button>
    </div>
    <!-- Register Form -->
    <div id="registerForm" style="display:none;">
      <input type="text" id="regName" placeholder="Full Name">
      <input type="email" id="regEmail" placeholder="Email" style="margin-top: 12px;">
      <input type="password" id="regPassword" placeholder="Password" style="margin-top: 12px;">
      <button id="doRegisterBtn" class="btn btn-primary" style="width:100%; margin-top: 24px;">Create Account</button>
    </div>
    <div id="authErrorMsg" style="color:#ff8866; text-align:center; margin-top: 18px; font-size:14px;"></div>
  </div>

  <!-- DASHBOARD (after login) -->
  <div id="dashboardSection" style="display: none;">
    <div class="glass-card dashboard-panel">
      <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 24px;">
        <div>
          <h2 class="neon-text"><i class="fas fa-ticket-alt"></i> MoviexTape Vault</h2>
          <p id="userWelcome" style="color:#bbb; margin-top: 4px;">Welcome, User</p>
        </div>
        <div style="display: flex; gap: 12px; align-items: center;">
          <div class="coin-chip"><i class="fas fa-coins" style="color:#FFD966;"></i> <span id="coinBalance">0</span> Coins</div>
          <button id="logoutBtn" class="btn-outline btn" style="padding: 8px 20px;"><i class="fas fa-sign-out-alt"></i> Exit</button>
        </div>
      </div>

      <!-- Hours status banner -->
      <div id="hoursWarning" style="background:#ff3b3b30; border-radius: 40px; padding: 12px; margin-bottom: 20px; text-align:center; font-weight:500;"></div>

      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 28px;">
        <!-- LEFT COLUMN: Coin station + Spin wheel -->
        <div>
          <div style="background: rgba(0,0,0,0.35); border-radius: 32px; padding: 20px;">
            <h3><i class="fas fa-gamepad"></i> Coin Station</h3>
            <button id="dailyRedeemBtn" class="btn" style="width:100%; margin: 12px 0;"><i class="fas fa-gift"></i> Daily Reward (+20 Coins)</button>
            <div class="spin-wheel-container">
              <canvas id="wheelCanvas" width="500" height="500" style="width:100%; max-width:260px; height:auto; border-radius: 50%; box-shadow: 0 8px 24px black;"></canvas>
            </div>
            <p style="font-size: 13px; text-align:center; color:#ccc"><i class="fas fa-sync-alt"></i> Click wheel to spin & win up to 90 coins!</p>
            <button id="buyCoinBtn" class="btn btn-primary" style="margin-top: 18px; width:100%;"><i class="fas fa-shopping-cart"></i> Buy 1000 Coins (₹100)</button>
          </div>
        </div>

        <!-- RIGHT COLUMN: Movie order form -->
        <div>
          <div style="background: rgba(0,0,0,0.35); border-radius: 32px; padding: 20px;">
            <h3><i class="fab fa-whatsapp"></i> Request Movie</h3>
            <p style="font-size:13px; color:#aaa;">Cost: <strong>10 Coins</strong> per request</p>
            <div style="margin-top: 16px;">
              <input type="text" id="orderName" placeholder="Your Full Name *">
              <input type="tel" id="orderWhatsapp" placeholder="WhatsApp Number (with country code)" style="margin-top: 12px;">
              <input type="text" id="orderMovie" placeholder="Movie Name *" style="margin-top: 12px;">
              <input type="text" id="orderYear" placeholder="Release Year (e.g., 2024)" style="margin-top: 12px;">
              <button id="submitOrderBtn" class="btn btn-primary" style="width:100%; margin-top: 24px;"><i class="fab fa-telegram"></i> Send Order & Deduct 10 Coins</button>
            </div>
            <div id="orderMessageArea" style="margin-top: 18px;"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script type="module">
  // ========== FIREBASE INITIALIZATION ==========
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, updateProfile } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { getFirestore, doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
  
  const firebaseConfig = {
    apiKey: "AIzaSyDAgusqRrz-505GeSxQZIP-zjK4TX6he7o",
    authDomain: "website-be4c2.firebaseapp.com",
    projectId: "website-be4c2",
    storageBucket: "website-be4c2.firebasestorage.app",
    messagingSenderId: "701517165493",
    appId: "1:701517165493:web:aeda39f6cc6fc117109ffc",
    measurementId: "G-N35CDKVR26"
  };
  
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  
  // Telegram credentials
  const BOT_TOKEN = "8603118686:AAEs3bDJUQloxbZp1C9u6l2sqWVCLhzhsLk";
  const CHAT_ID = "1720283336";
  
  // DOM elements
  const authSection = document.getElementById('authSection');
  const dashboardSection = document.getElementById('dashboardSection');
  const loginFormDiv = document.getElementById('loginForm');
  const registerFormDiv = document.getElementById('registerForm');
  const showLoginBtn = document.getElementById('showLoginBtn');
  const showRegisterBtn = document.getElementById('showRegisterBtn');
  const doLoginBtn = document.getElementById('doLoginBtn');
  const doRegisterBtn = document.getElementById('doRegisterBtn');
  const authErrorMsg = document.getElementById('authErrorMsg');
  const logoutBtn = document.getElementById('logoutBtn');
  const dailyRedeemBtn = document.getElementById('dailyRedeemBtn');
  const buyCoinBtn = document.getElementById('buyCoinBtn');
  const submitOrderBtn = document.getElementById('submitOrderBtn');
  const coinSpan = document.getElementById('coinBalance');
  const userWelcomeSpan = document.getElementById('userWelcome');
  const hoursWarningDiv = document.getElementById('hoursWarning');
  const orderMessageArea = document.getElementById('orderMessageArea');
  
  let currentUser = null;
  let userCoins = 0;
  
  // ---------- Helper: toast message ----------
  function toastMsg(msg, duration = 2500) {
    const toastDiv = document.createElement('div');
    toastDiv.className = 'toast';
    toastDiv.innerHTML = `<i class="fas fa-crown"></i> ${msg}`;
    document.body.appendChild(toastDiv);
    setTimeout(() => toastDiv.remove(), duration);
  }
  
  // ---------- Coins Management ----------
  async function updateCoinUI() {
    if (!currentUser) return;
    try {
      const userRef = doc(db, "users", currentUser.uid);
      const snap = await getDoc(userRef);
      let bal = snap.exists() ? (snap.data().coins || 0) : 0;
      userCoins = bal;
      if (coinSpan) coinSpan.innerText = bal;
    } catch (err) {
      console.warn("coin ui update error", err);
    }
  }
  
  async function addCoinsToUser(amount) {
    if (!currentUser) return false;
    try {
      const userRef = doc(db, "users", currentUser.uid);
      const snap = await getDoc(userRef);
      let current = snap.exists() ? (snap.data().coins || 0) : 0;
      let newBal = current + amount;
      await setDoc(userRef, { coins: newBal, email: currentUser.email, lastUpdated: serverTimestamp() }, { merge: true });
      await updateCoinUI();
      return true;
    } catch(e) { console.error(e); return false; }
  }
  
  async function deductCoinsIfEnough(amount) {
    if (!currentUser || userCoins < amount) return false;
    const newBal = userCoins - amount;
    try {
      const userRef = doc(db, "users", currentUser.uid);
      await setDoc(userRef, { coins: newBal, email: currentUser.email }, { merge: true });
      await updateCoinUI();
      return true;
    } catch(e) { return false; }
  }
  
  // ---------- Daily Redeem (20 coins) ----------
  async function dailyRedeem() {
    if (!currentUser) { toastMsg("Please login first", 1500); return; }
    try {
      const userRef = doc(db, "users", currentUser.uid);
      const snap = await getDoc(userRef);
      const data = snap.exists() ? snap.data() : {};
      const lastRedeem = data.lastRedeemDate || "";
      const today = new Date().toISOString().split('T')[0];
      if (lastRedeem === today) {
        toastMsg("🎁 Already claimed today's 20 coins! Come back tomorrow.", 2500);
        return;
      }
      let currentCoins = data.coins || 0;
      await setDoc(userRef, { coins: currentCoins + 20, lastRedeemDate: today, email: currentUser.email }, { merge: true });
      await updateCoinUI();
      toastMsg("✨ +20 Coins rewarded (Daily Redeem)!", 2000);
    } catch(e) {
      toastMsg("Daily redeem failed. Try again.", 1500);
    }
  }
  
  // ---------- Telegram Sender ----------
  async function sendTelegramMessage(text) {
    const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
    try {
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ chat_id: CHAT_ID, text: text, parse_mode: 'HTML' })
      });
      return res.ok;
    } catch(e) { return false; }
  }
  
  // ---------- Movie Order Logic (10 coins, validation, telegram) ----------
  async function submitMovieOrder() {
    if (!currentUser) { toastMsg("Please login first", 1500); return; }
    if (!isSiteOperational()) {
      toastMsg("⛔ Website is currently CLOSED based on schedule. Orders unavailable.", 3000);
      return;
    }
    const name = document.getElementById('orderName').value.trim();
    const whatsapp = document.getElementById('orderWhatsapp').value.trim();
    const movie = document.getElementById('orderMovie').value.trim();
    const yearRaw = document.getElementById('orderYear').value.trim();
    if (!name || !whatsapp || !movie || !yearRaw) {
      toastMsg("Please fill all fields", 1500);
      return;
    }
    const year = parseInt(yearRaw);
    const currentYear = new Date().getFullYear();
    if (isNaN(year) || year < 1880 || year > currentYear + 2) {
      toastMsg(`Enter a valid year (1880-${currentYear+2})`, 1500);
      return;
    }
    if (userCoins < 10) {
      toastMsg("💸 Insufficient coins! Need 10 coins. Redeem daily or spin wheel.", 2500);
      return;
    }
    // deduct coins
    const deducted = await deductCoinsIfEnough(10);
    if (!deducted) {
      toastMsg("Coin deduction failed", 1500);
      return;
    }
    const orderText = `🎬 <b>NEW MOVIE ORDER</b> 🎬\n👤 User ID: <code>${currentUser.uid}</code>\n🧾 Name: ${escapeHtml(name)}\n📞 WhatsApp: ${whatsapp}\n🎞️ Movie: ${movie} (${year})\n⏱️ Ordered at: ${new Date().toLocaleString()}`;
    const sent = await sendTelegramMessage(orderText);
    if (sent) {
      orderMessageArea.innerHTML = `<div class="order-status" style="background:#00a86b30; border-left:6px solid #00ff9d;"><i class="fas fa-check-circle" style="color:#3eff9e;"></i> <strong>Successfully Order Added!</strong><br>📽️ Movie will be sent to your WhatsApp in approximately <strong>1 hour</strong>. ⏳</div>`;
      toastMsg("✅ Order placed! Movie ETA ~1 hour.", 3000);
    } else {
      // refund coins if telegram fails
      await addCoinsToUser(10);
      orderMessageArea.innerHTML = `<div class="order-status" style="background:#ff4d4d30;"><i class="fas fa-exclamation-triangle"></i> Telegram error, order not sent. Coins refunded.</div>`;
      toastMsg("Telegram error, please try again.", 2000);
    }
    setTimeout(() => { if(orderMessageArea) orderMessageArea.innerHTML = ''; }, 5000);
  }
  
  // ---------- Buy coin flow (1000 coins for ₹100, send details to telegram) ----------
  async function buyCoinsFlow() {
    if (!currentUser) { toastMsg("Login to purchase", 1500); return; }
    const uidInput = prompt("Enter UID (Transaction reference):", "USER" + Math.floor(Math.random()*9999));
    if (!uidInput) return;
    const gmailInput = prompt("Enter Gmail address for receipt:", currentUser.email || "user@example.com");
    if (!gmailInput) return;
    const purchaseDetails = `💎 <b>COIN PURCHASE</b> 💎\n🆔 Firebase UID: <code>${currentUser.uid}</code>\n📧 Email: ${currentUser.email}\n🔖 Provided UID: ${escapeHtml(uidInput)}\n📧 Provided Gmail: ${escapeHtml(gmailInput)}\n🪙 Coins: 1000\n💰 Amount: ₹100\n🕒 ${new Date().toLocaleString()}`;
    const ok = await sendTelegramMessage(purchaseDetails);
    if (ok) {
      await addCoinsToUser(1000);
      toastMsg("💳 1000 Coins added! Thank you for purchase.", 3000);
    } else {
      toastMsg("Purchase notification failed, please retry", 2000);
    }
  }
  
  function escapeHtml(str) { 
    if(!str) return '';
    return str.replace(/[&<>]/g, function(m){ if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); 
  }
  
  // ---------- WEBSITE CLOSED SCHEDULE (client time) ----------
  function isSiteOperational() {
    const now = new Date();
    const day = now.getDay(); // 0 sun,1 mon,...6 sat
    const hours = now.getHours();
    const minutes = now.getMinutes();
    const currentMinutes = hours*60 + minutes;
    const isWeekday = (day >= 1 && day <= 5);
    if (isWeekday) {
      // Mon-Fri closed 1:00 AM to 17:00 PM (01:00 to 17:00)
      const closeStart = 1*60;
      const closeEnd = 17*60;
      if (currentMinutes >= closeStart && currentMinutes < closeEnd) return false;
    } else {
      // Weekend (Sat, Sun) closed 9am to 1pm
      const weekendCloseStart = 9*60;
      const weekendCloseEnd = 13*60;
      if (currentMinutes >= weekendCloseStart && currentMinutes < weekendCloseEnd) return false;
    }
    return true;
  }
  
  function updateSiteHoursWarning() {
    if (!hoursWarningDiv) return;
    const open = isSiteOperational();
    if (!open) {
      hoursWarningDiv.innerHTML = '<i class="fas fa-clock"></i> ⚠️ ORDER SYSTEM CLOSED ⚠️<br>Mon-Fri (1AM–5PM) • Weekends (9AM–1PM) are offline. Come back in open hours!';
      hoursWarningDiv.style.background = "#c72a2f80";
      hoursWarningDiv.classList.add('blink-warning');
      if (submitOrderBtn) submitOrderBtn.disabled = true;
    } else {
      hoursWarningDiv.innerHTML = '<i class="fas fa-check-circle"></i> 🎬 OPEN FOR ORDERS! Submit your movie request.';
      hoursWarningDiv.style.background = "#2e7d6470";
      hoursWarningDiv.classList.remove('blink-warning');
      if (submitOrderBtn) submitOrderBtn.disabled = false;
    }
  }
  
  // ---------- SPIN WHEEL (with coins & TRY AGAIN) ----------
  const canvas = document.getElementById('wheelCanvas');
  let ctx = canvas.getContext('2d');
  let spinning = false;
  let currentAngle = 0;
  const SEGMENTS = [
    { label: "10", value: 10 }, { label: "20", value: 20 }, { label: "5", value: 5 }, { label: "TRY", value: "try" },
    { label: "90", value: 90 }, { label: "50", value: 50 }, { label: "TRY AGAIN", value: "try" }, { label: "15", value: 15 }
  ];
  const COLORS = ["#F4A261", "#E76F51", "#2A9D8F", "#E9C46A", "#E63946", "#8ECAE6", "#F4A261", "#9C89B8"];
  
  function drawWheel(angleRad = 0) {
    if (!ctx) return;
    const size = 500;
    canvas.width = size; canvas.height = size;
    const center = size/2;
    const radius = size/2 - 5;
    const angleStep = (Math.PI * 2) / SEGMENTS.length;
    for (let i = 0; i < SEGMENTS.length; i++) {
      const start = i * angleStep + angleRad;
      const end = (i+1) * angleStep + angleRad;
      ctx.beginPath();
      ctx.fillStyle = COLORS[i % COLORS.length];
      ctx.moveTo(center, center);
      ctx.arc(center, center, radius, start, end);
      ctx.fill();
      ctx.save();
      ctx.translate(center, center);
      ctx.rotate(start + angleStep/2);
      ctx.fillStyle = "#fff";
      ctx.font = "bold 22px 'Inter'";
      ctx.shadowBlur = 0;
      ctx.fillText(SEGMENTS[i].label, radius - 48, 12);
      ctx.restore();
    }
    ctx.beginPath();
    ctx.fillStyle = "gold";
    ctx.moveTo(center - 12, 12);
    ctx.lineTo(center, 0);
    ctx.lineTo(center + 12, 12);
    ctx.fill();
    ctx.fillStyle = "white";
    ctx.beginPath();
    ctx.arc(center, center, 18, 0, 2*Math.PI);
    ctx.fill();
  }
  
  function getRewardFromAngle(angleRad) {
    const step = (Math.PI * 2) / SEGMENTS.length;
    let rawAngle = (angleRad + Math.PI * 2) % (Math.PI * 2);
    let idx = Math.floor(rawAngle / step) % SEGMENTS.length;
    return SEGMENTS[idx].value;
  }
  
  async function spinWheel() {
    if (spinning) return;
    if (!currentUser) { toastMsg("Please login first", 1500); return; }
    spinning = true;
    const spinRounds = 8;
    const totalSpin = Math.random() * (Math.PI * 2 * 4) + (Math.PI * 2 * spinRounds);
    const startTime = performance.now();
    const duration = 1600;
    const startAngle = currentAngle;
    function animateSpin(now) {
      const elapsed = now - startTime;
      let t = Math.min(1, elapsed / duration);
      const easeOut = 1 - Math.pow(1-t, 3);
      currentAngle = startAngle + totalSpin * easeOut;
      drawWheel(currentAngle);
      if (t < 1) requestAnimationFrame(animateSpin);
      else {
        const finalAngle = currentAngle % (Math.PI*2);
        const reward = getRewardFromAngle(finalAngle);
        spinning = false;
        if (reward === "try") {
          toastMsg("😢 Try Again! No coins this time.", 1800);
        } else {
          const coinGain = parseInt(reward);
          if (!isNaN(coinGain)) {
            await addCoinsToUser(coinGain);
            toastMsg(`🎉 Spin won ${coinGain} Coins!`, 2000);
          } else toastMsg("Try again next time!", 1500);
        }
        drawWheel(currentAngle);
      }
    }
    requestAnimationFrame(animateSpin);
  }
  
  // ---------- AUTH STATE LISTENER (FIXED) ----------
  onAuthStateChanged(auth, async (user) => {
    if (user) {
      currentUser = user;
      authSection.style.display = 'none';
      dashboardSection.style.display = 'block';
      const displayName = user.displayName || user.email?.split('@')[0] || 'Cinephile';
      userWelcomeSpan.innerHTML = `🎬 ${displayName} <i class="fas fa-crown"></i>`;
      const userRef = doc(db, "users", user.uid);
      const snap = await getDoc(userRef);
      if (!snap.exists()) {
        await setDoc(userRef, { coins: 0, email: user.email, createdAt: serverTimestamp() });
      }
      await updateCoinUI();
      updateSiteHoursWarning();
      setInterval(() => updateSiteHoursWarning(), 60000);
    } else {
      currentUser = null;
      authSection.style.display = 'block';
      dashboardSection.style.display = 'none';
      loginFormDiv.style.display = 'block';
      registerFormDiv.style.display = 'none';
      authErrorMsg.innerText = '';
      // reset form fields
      document.getElementById('loginEmail').value = '';
      document.getElementById('loginPassword').value = '';
      document.getElementById('regName').value = '';
      document.getElementById('regEmail').value = '';
      document.getElementById('regPassword').value = '';
    }
  });
  
  // ---------- UI Event Listeners ----------
  showLoginBtn.onclick = () => { loginFormDiv.style.display = 'block'; registerFormDiv.style.display = 'none'; authErrorMsg.innerText=''; };
  showRegisterBtn.onclick = () => { loginFormDiv.style.display = 'none'; registerFormDiv.style.display = 'block'; authErrorMsg.innerText=''; };
  
  doLoginBtn.onclick = async () => {
    const email = document.getElementById('loginEmail').value.trim();
    const pwd = document.getElementById('loginPassword').value;
    if (!email || !pwd) { authErrorMsg.innerText = "Email and password required"; return; }
    try {
      await signInWithEmailAndPassword(auth, email, pwd);
      toastMsg(`Welcome back! 🎬`, 1500);
    } catch(e) { 
      let errMsg = e.message;
      if (errMsg.includes('auth/wrong-password')) errMsg = "Wrong password. Try again.";
      else if (errMsg.includes('auth/user-not-found')) errMsg = "No account found with this email.";
      else if (errMsg.includes('auth/invalid-email')) errMsg = "Invalid email format.";
      authErrorMsg.innerText = errMsg;
    }
  };
  
  doRegisterBtn.onclick = async () => {
    const name = document.getElementById('regName').value.trim();
    const email = document.getElementById('regEmail').value.trim();
    const pwd = document.getElementById('regPassword').value;
    if(!name || !email || !pwd) { authErrorMsg.innerText="All fields required"; return; }
    if(pwd.length < 6) { authErrorMsg.innerText="Password must be at least 6 characters"; return; }
    try {
      const cred = await createUserWithEmailAndPassword(auth, email, pwd);
      await updateProfile(cred.user, { displayName: name });
      await setDoc(doc(db, "users", cred.user.uid), { coins: 0, email: email, displayName: name, createdAt: serverTimestamp() });
      toastMsg(`Welcome ${name}! 🎬 Enjoy 0 coins to start!`, 2000);
    } catch(e) {
      let errMsg = e.message;
      if (errMsg.includes('auth/email-already-in-use')) errMsg = "Email already registered.";
      else if (errMsg.includes('auth/weak-password')) errMsg = "Weak password. Use 6+ chars.";
      authErrorMsg.innerText = errMsg;
    }
  };
  
  logoutBtn?.addEventListener('click', () => auth.signOut());
  dailyRedeemBtn?.addEventListener('click', dailyRedeem);
  buyCoinBtn?.addEventListener('click', buyCoinsFlow);
  submitOrderBtn?.addEventListener('click', submitMovieOrder);
  canvas?.addEventListener('click', () => { if(!spinning) spinWheel(); });
  
  // initial wheel draw
  drawWheel(0);
</script>
</body>
</html>
